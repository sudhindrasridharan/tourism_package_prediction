
name: Tourism Package Prediction MLOps Pipeline

# ============================================================
# TRIGGER THE WORKFLOW
# ============================================================

on:

  # Run whenever code is pushed to main
  push:
    branches:
      - main

    # Do NOT trigger the pipeline again when only
    # the automatically generated model is updated
    paths-ignore:
      - "deployment/best_model.pkl"

  # Allow manual execution from GitHub
  workflow_dispatch:


# ============================================================
# PREVENT MULTIPLE PIPELINES FROM RUNNING AT THE SAME TIME
# ============================================================

concurrency:
  group: tourism-package-prediction
  cancel-in-progress: false


# ============================================================
# JOB 1: DATA PREPARATION
# ============================================================

jobs:

  data-preparation:

    name: Data Preparation

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Step 1: Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Step 2: Check repository path and files
      # ------------------------------------------------------

      - name: Check repository path and files
        run: |
          echo "Current working directory:"
          pwd

          echo ""
          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Data folder contents:"
          ls -la data

          echo ""
          echo "Checking tourism.csv:"
          test -f data/tourism.csv
          echo "tourism.csv found successfully."

          echo ""
          echo "All repository files:"
          find . -maxdepth 3 -type f | sort


      # ------------------------------------------------------
      # Step 3: Set up Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Step 4: Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn numpy


      # ------------------------------------------------------
      # Step 5: Run data preparation
      # ------------------------------------------------------

      - name: Run data preparation
        run: |
          python data_preparation.py


      # ------------------------------------------------------
      # Step 6: Verify prepared datasets
      # ------------------------------------------------------

      - name: Verify prepared data
        run: |
          echo "Processed data files:"
          ls -lh data/processed/

          test -f data/processed/train.csv
          test -f data/processed/test.csv

          echo "train.csv and test.csv found successfully."


      # ------------------------------------------------------
      # Step 7: Upload train/test data as artifact
      # ------------------------------------------------------

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: data/processed/


  # ==========================================================
  # JOB 2: MODEL BUILDING
  # ==========================================================

  model-building:

    name: Model Building

    needs: data-preparation

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Step 1: Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Step 2: Check repository
      # ------------------------------------------------------

      - name: Check repository path and files
        run: |
          echo "Current working directory:"
          pwd

          echo ""
          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Data folder contents:"
          ls -la data


      # ------------------------------------------------------
      # Step 3: Set up Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Step 4: Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow


      # ------------------------------------------------------
      # Step 5: Download prepared data
      # ------------------------------------------------------

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: data/processed/


      # ------------------------------------------------------
      # Step 6: Verify prepared data
      # ------------------------------------------------------

      - name: Verify prepared data
        run: |
          echo "Downloaded training and testing data:"
          ls -lh data/processed/

          test -f data/processed/train.csv
          test -f data/processed/test.csv

          echo "Prepared data verified successfully."


      # ------------------------------------------------------
      # Step 7: Run model training and evaluation
      # ------------------------------------------------------

      - name: Train and evaluate model
        run: |
          python model_building/train.py


      # ------------------------------------------------------
      # Step 8: Verify trained model
      # ------------------------------------------------------

      - name: Verify trained model
        run: |
          echo "Deployment directory:"
          ls -lh deployment/

          test -f deployment/best_model.pkl

          echo "Best model created successfully."


      # ------------------------------------------------------
      # Step 9: Upload trained model
      # ------------------------------------------------------

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: deployment/best_model.pkl


  # ==========================================================
  # JOB 3: UPDATE REPOSITORY
  # ==========================================================

  update-repository:

    name: Update Repository

    needs: model-building

    runs-on: ubuntu-latest

    # Give GitHub Actions permission to push to main
    permissions:
      contents: write

    steps:

      # ------------------------------------------------------
      # Step 1: Checkout LATEST main branch
      # ------------------------------------------------------

      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ------------------------------------------------------
      # Step 2: Display current Git status
      # ------------------------------------------------------

      - name: Check Git status
        run: |
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git log -1 --oneline

          echo ""
          echo "Git status:"
          git status


      # ------------------------------------------------------
      # Step 3: Download trained model
      # ------------------------------------------------------

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: deployment/


      # ------------------------------------------------------
      # Step 4: Verify trained model
      # ------------------------------------------------------

      - name: Verify trained model
        run: |
          echo "Deployment directory:"
          ls -lh deployment/

          test -f deployment/best_model.pkl

          echo "best_model.pkl found successfully."


      # ------------------------------------------------------
      # Step 5: Configure Git
      # ------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ------------------------------------------------------
      # Step 6: Fetch latest changes from main
      # ------------------------------------------------------

      - name: Fetch latest main
        run: |
          git fetch origin main


      # ------------------------------------------------------
      # Step 7: Pull latest changes before committing
      # ------------------------------------------------------

      - name: Pull latest changes
        run: |
          git pull --rebase origin main


      # ------------------------------------------------------
      # Step 8: Add updated model
      # ------------------------------------------------------

      - name: Add updated model
        run: |
          git add deployment/best_model.pkl


      # ------------------------------------------------------
      # Step 9: Commit updated model
      # ------------------------------------------------------

      - name: Commit updated model
        run: |

          if git diff --cached --quiet; then
            echo "No changes detected in best_model.pkl."
            echo "Nothing to commit."
          else
            git commit -m "Update trained tourism prediction model"
            echo "Model update committed successfully."
          fi


      # ------------------------------------------------------
      # Step 10: Push updated model to main
      # ------------------------------------------------------

      - name: Push updates to main
        run: |
          git push origin main
